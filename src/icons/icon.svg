<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Gulf Almanac icon: a dial on the chassis, with the tide below and an amber needle. -->
  <rect width="180" height="180" fill="#F5F4F0"/>
  <defs><clipPath id="dial"><circle cx="90" cy="90" r="58"/></clipPath></defs>
  <g clip-path="url(#dial)">
    <path d="M20 112 C 48 88, 70 88, 90 108 S 132 128, 160 104 V 160 H 20 Z" fill="#2A6FA8" opacity=".18"/>
    <path d="M20 112 C 48 88, 70 88, 90 108 S 132 128, 160 104" fill="none" stroke="#2A6FA8" stroke-width="6" stroke-linecap="round"/>
  </g>
  <circle cx="90" cy="90" r="58" fill="none" stroke="#1A1A18" stroke-width="5"/>
  <g stroke="#1A1A18" stroke-width="3" stroke-linecap="round">
    <line x1="90" y1="40" x2="90" y2="48"/><line x1="140" y1="90" x2="132" y2="90"/>
    <line x1="90" y1="140" x2="90" y2="132"/><line x1="40" y1="90" x2="48" y2="90"/>
  </g>
  <line x1="90" y1="90" x2="124" y2="56" stroke="#E59400" stroke-width="5" stroke-linecap="round"/>
  <circle cx="90" cy="90" r="6" fill="#1A1A18"/>
</svg>
