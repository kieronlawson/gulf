# .claude/approvals.yml
# Claude Approvals policy. Reference: https://code.claude.com/docs/en/approvals-policy
#
# One person has write access to this repository, so no rule asks for a second person.
# The author of a pull request fills one seat without approving. What this policy enforces
# is Claude's Code Review: a change merges only after the review passes.
#
# The policy is enforced: with no mode line, the mode is enforce. Claude posts an approving review
# once the Code Review passes. The check blocks a merge only where GitHub requires it on main.
version: 1
rules:
  - purpose: "A change merges once Claude's Code Review passes. The author fills the one seat, and Claude approves."
    paths: ["**"]
    verdict: { claude: blocks }
    override:
      - { if: "claude/code_review = pass", verdict: { claude: approves, seats: 1 } }
  - purpose: "Claude does not approve a change to the review rules. The change still needs a passing Code Review."
    paths: ["**/.claude/**"]
    nested: inherit
    verdict: { claude: comments, seats: 1 }
